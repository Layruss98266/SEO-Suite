name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2DEFA7A9E50CCE8999 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov=core \
            --cov=tools \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short -q
        env:
          PAGESPEED_API_KEY: ""
          SERPAPI_KEY: ""

      - name: Upload coverage report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f7e2bde1c5aa5a28b01474b # v4.6.0
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2DEFA7A9E50CCE8999 # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff

      - name: Ruff lint
        run: ruff check . --output-format=github
        continue-on-error: true   # warn-only until lint baseline is clean

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true   # warn-only until format baseline is clean

  # ── Type check ───────────────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2DEFA7A9E50CCE8999 # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Mypy
        run: mypy core/ tools/ app/ --ignore-missing-imports
        continue-on-error: true   # warn-only until type coverage improves

  # ── Security ─────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2DEFA7A9E50CCE8999 # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pip-audit bandit

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt --strict

      - name: Static security scan (bandit)
        run: bandit -r app/ core/ tools/ -ll -ii
        continue-on-error: true   # warn-only — surfaces common security smells
