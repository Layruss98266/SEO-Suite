name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Ruff lint
        run: ruff check . --output-format=github
        continue-on-error: true   # warn-only until lint baseline is clean

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true   # warn-only until format baseline is clean

      # ── Type check ────────────────────────────────────────────────────────
      - name: Mypy type check
        run: mypy core/ tools/ app/ --ignore-missing-imports
        continue-on-error: true   # type errors are warnings until coverage improves

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=core \
            --cov=tools \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
        env:
          # Prevent any real network calls during tests
          PAGESPEED_API_KEY: ""
          SERPAPI_KEY: ""

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
