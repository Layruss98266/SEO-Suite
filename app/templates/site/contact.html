{% extends "site/base.html" %}
{% block title %}Contact · SEO Suite{% endblock %}

{% block content %}
<section class="hero" style="padding:90px 0 40px">
  <div class="container">
    <span class="eyebrow reveal">Contact</span>
    <h1 class="reveal">Let's <span class="grad-text">talk.</span></h1>
    <p class="lead reveal" style="margin:22px auto 0">Questions, feature requests, or a bug report? Send a note — we read every message, usually within a couple of days.</p>
  </div>
</section>

<section style="padding-top:24px">
  <div class="container">
    <form class="form reveal" id="contact-form" data-submit-action="submitContact">
      <div id="contact-msg" class="form-msg"></div>
      <div>
        <label for="c-name">Name</label>
        <input id="c-name" name="name" type="text" placeholder="Your name" required>
      </div>
      <div>
        <label for="c-email">Email</label>
        <input id="c-email" name="email" type="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="c-message">Message</label>
        <textarea id="c-message" name="message" rows="5" placeholder="How can we help?" required></textarea>
      </div>
      <button class="btn btn-primary btn-lg" type="submit" id="c-submit">Send message</button>
    </form>
  </div>
</section>

<script src="{{ url_for('static', filename='js/site-contact.js') }}"></script>
{% endblock %}
