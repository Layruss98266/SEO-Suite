{% extends "site/base.html" %}
{% block title %}Contact — SEO Suite{% endblock %}

{% block content %}
<section class="hero" style="padding:90px 0 40px">
  <div class="container">
    <span class="eyebrow reveal">Contact</span>
    <h1 class="reveal">Let's <span class="grad-text">talk.</span></h1>
    <p class="lead reveal" style="margin:22px auto 0">Questions, feature requests, or want to be notified about the hosted Cloud version? Send a note.</p>
  </div>
</section>

<section style="padding-top:24px">
  <div class="container">
    <form class="form reveal" id="contact-form" onsubmit="return submitContact(event)">
      <div id="contact-msg" class="form-msg"></div>
      <div>
        <label for="c-name">Name</label>
        <input id="c-name" name="name" type="text" placeholder="Your name" required>
      </div>
      <div>
        <label for="c-email">Email</label>
        <input id="c-email" name="email" type="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="c-message">Message</label>
        <textarea id="c-message" name="message" rows="5" placeholder="How can we help?" required></textarea>
      </div>
      <button class="btn btn-primary btn-lg" type="submit" id="c-submit">Send message</button>
    </form>
  </div>
</section>

<script>
async function submitContact(e) {
  e.preventDefault();
  var msg = document.getElementById('contact-msg');
  var btn = document.getElementById('c-submit');
  msg.className = 'form-msg';
  var payload = {
    name:    document.getElementById('c-name').value.trim(),
    email:   document.getElementById('c-email').value.trim(),
    message: document.getElementById('c-message').value.trim(),
  };
  if (!payload.name || !payload.email || !payload.message) {
    msg.className = 'form-msg err'; msg.textContent = 'Please fill in all fields.'; return false;
  }
  btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Sending…';
  try {
    var r = await fetch('/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    var d = await r.json();
    if (r.ok && d.ok) {
      msg.className = 'form-msg ok';
      msg.textContent = d.message || 'Thanks — your message has been received.';
      document.getElementById('contact-form').reset();
    } else {
      msg.className = 'form-msg err'; msg.textContent = (d && d.error) || 'Something went wrong. Please try again.';
    }
  } catch (err) {
    msg.className = 'form-msg err'; msg.textContent = 'Network error — please try again.';
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
  return false;
}
</script>
{% endblock %}
