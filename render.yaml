# Render Blueprint — deploy SEO Suite with one click.
# In Render: New > Blueprint, point it at this repo. Render reads this file.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: seo-suite
    runtime: docker
    dockerfilePath: ./Dockerfile
    # A persistent disk requires a paid instance type. On the free tier the
    # disk is ephemeral (reports/users.json reset on redeploy) but the app runs.
    plan: starter
    # Single instance ONLY — run state + SSE queues live in process memory and
    # must not be split across instances.
    numInstances: 1
    healthCheckPath: /
    disk:
      name: seo-suite-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SEO_SUITE_SECRET     # signs session cookies; keep it stable
        generateValue: true
      - key: SEO_SUITE_DATA_DIR
        value: /app/data
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional: set these to enable the env superadmin (otherwise use /signup).
      # - key: SEO_SUITE_USERNAME
      #   sync: false
      # - key: SEO_SUITE_PASSWORD_HASH
      #   sync: false
