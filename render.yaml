# Render Blueprint — deploy SEO Suite with one click.
# In Render: New > Blueprint, point it at this repo. Render reads this file.
# Docs: https://render.com/docs/blueprint-spec
#
# This file is set up for the FREE tier (zero cost) so you can deploy first.
# Trade-off: free instances have no persistent disk and sleep when idle, so the
# data directory (reports, uploads, users.json, saved API keys) resets on each
# redeploy/cold start. Fine for a demo or trial.
#
# SESSION PERSISTENCE: After your first deploy, go to Render Dashboard → Environment
# and manually set SEO_SUITE_SECRET to a stable random 64-char hex string.
# Generate one locally with: python -c "import secrets; print(secrets.token_hex(32))"
# A stable secret ensures logins survive restarts and re-deploys.
#
# To make it production-ready (data survives restarts), see "UPGRADE" below:
#   1. change `plan: free` to `plan: starter`
#   2. uncomment the `disk:` block
services:
  - type: web
    name: seo-suite
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Single instance ONLY — run state + SSE queues live in process memory and
    # must not be split across instances. (Free tier is single-instance anyway.)
    numInstances: 1
    healthCheckPath: /health
    # ── UPGRADE: uncomment for persistent data (requires plan: starter) ──
    # disk:
    #   name: seo-suite-data
    #   mountPath: /app/data
    #   sizeGB: 1
    envVars:
      # IMPORTANT: Set this manually in Render Dashboard → Environment to a stable
      # 64-char hex string. Using generateValue would create a new secret on every
      # deploy, invalidating all user sessions and forcing everyone to re-login.
      # Generate once: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SEO_SUITE_SECRET
        sync: false
      - key: SEO_SUITE_DATA_DIR
        value: /app/data
      # Enable secure (HTTPS-only) session cookies — Render always serves HTTPS.
      - key: SEO_SUITE_COOKIE_SECURE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional: set these to enable the env superadmin (otherwise use /signup).
      # - key: SEO_SUITE_USERNAME
      #   sync: false
      # - key: SEO_SUITE_PASSWORD_HASH
      #   sync: false
